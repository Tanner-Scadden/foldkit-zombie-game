name: Deploy

# Pushes to main deploy production to Cloudflare once the checks pass. Each
# pull request deploys its own preview stage and comments its URL, and the
# preview is destroyed when the pull request closes. See infra/README.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  check:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      # NOTE: the audit tools keep their own package.json, and typecheck
      # covers them, so their types (Bun, playwright-core) must be installed.
      - run: bun install --frozen-lockfile
        working-directory: tools/audit
      - run: bun run typecheck
      - run: bun run lint
      # NOTE: the full tier: the fast tests plus the sim tier (whole wave
      # replays and seed sweeps) that `bun run test` leaves out.
      - run: bun run test:full
      - run: bun run build
      - run: bun run typecheck
        working-directory: infra
      - run: bun run lint
        working-directory: infra
      - run: bun run test
        working-directory: infra

  deploy:
    needs: check
    if: github.event.action != 'closed' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      - id: deploy
        name: Deploy ${{ env.STAGE }}
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
        run: |
          set -o pipefail
          bun alchemy deploy --stage "$STAGE" --yes --no-input | tee "$RUNNER_TEMP/deploy.log"
          output_url() {
            grep -oE "(^|[^A-Za-z])$1: 'https://[a-z0-9.-]+\.workers\.dev'" "$RUNNER_TEMP/deploy.log" |
              tail -n 1 | grep -oE "https://[a-z0-9.-]+\.workers\.dev"
          }
          echo "url=$(output_url url)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(output_url apiUrl)" >> "$GITHUB_OUTPUT"
      - name: Check the site answers
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          test -n "$URL"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            if [ "$status" = "200" ]; then echo "$URL answered 200"; exit 0; fi
            sleep 5
          done
          echo "$URL answered $status"
          exit 1
      - name: Check the analytics API answers
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
        run: |
          test -n "$API_URL"
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -s "$API_URL/api/health" || true)
            if [ "$body" = '{"status":"Ok","database":"Ok"}' ]; then echo "$API_URL/api/health answered $body"; exit 0; fi
            sleep 5
          done
          echo "$API_URL/api/health answered $body"
          exit 1

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: infra
      - name: Refuse to destroy production
        run: |
          case "$STAGE" in
            pr-*) ;;
            *) echo "Refusing to destroy stage $STAGE"; exit 1 ;;
          esac
      - name: Destroy ${{ env.STAGE }}
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ github.event.number }}
        run: bun alchemy destroy --stage "$STAGE" --yes --no-input
