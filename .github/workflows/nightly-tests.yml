name: Nightly tests

# Test files share a worker's modules (`isolate: false` in vitest.config.ts),
# so a test that leaves a global, a spy, or a cache behind can break a later
# file, but only in some orders. Each night this runs the full tier with the
# files and tests in a shuffled order. The seed is the run number, printed
# below, so a failure replays locally with
#   bun run test:full -- --sequence.shuffle --sequence.seed=<seed>
# Run it by hand from the Actions tab with any seed.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      seed:
        description: The shuffle seed (empty for the run number)
        required: false

jobs:
  shuffled:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEED: ${{ github.event.inputs.seed || github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: echo "Shuffle seed $SEED"
      - run: bun run test:full -- --sequence.shuffle --sequence.seed="$SEED"
